# Prow job template for OTE shell test projects
#
# Replace placeholders:
#   ORG_NAME     — GitHub organization (e.g., openshift)
#   REPO_NAME    — GitHub repository (e.g., cnv-tests)
#   BRANCH       — Target branch (e.g., main)
#
# Place periodic jobs at:
#   openshift/release/ci-operator/jobs/ORG_NAME/REPO_NAME/
#
# For presubmits, ci-operator auto-generates from the config above.
# This template is for periodic jobs that run on a schedule.

periodics:
  - agent: kubernetes
    cluster: build05
    cron: '0 6 * * 1-5'
    decorate: true
    extra_refs:
      - base_ref: BRANCH
        org: ORG_NAME
        repo: REPO_NAME
    name: periodic-ci-ORG_NAME-REPO_NAME-BRANCH-e2e
    spec:
      containers:
        - args:
            - --gcs-upload-secret=/secrets/gcs/service-account.json
            - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
            - --report-credentials-file=/etc/report/credentials
            - --target=e2e
          command:
            - ci-operator
          image: ci-operator:latest
          name: ''
          resources:
            requests:
              cpu: 10m
          volumeMounts:
            - mountPath: /secrets/gcs
              name: gcs-credentials
              readOnly: true
            - mountPath: /etc/pull-secret
              name: pull-secret
              readOnly: true
            - mountPath: /etc/report
              name: result-aggregator
              readOnly: true
      serviceAccountName: ci-operator
      volumes:
        - name: gcs-credentials
          secret:
            secretName: gce-sa-credentials-gcs-publisher
        - name: pull-secret
          secret:
            secretName: registry-pull-credentials
        - name: result-aggregator
          secret:
            secretName: result-aggregator
